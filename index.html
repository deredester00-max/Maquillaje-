<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honduras Express</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
        }

        /* --- VENTANA EMERGENTE (SELECCIÓN DE SUCURSAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-card h2 {
            color: #e53935;
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Lista de Sucursales */
        .branch-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .branch-item {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.2s ease;
        }

        .branch-item:hover, .branch-item.selected {
            border-color: #e53935;
            background-color: #ffebee;
            color: #e53935;
        }

        .btn-accept {
            width: 100%;
            background-color: #e53935;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-accept:hover {
            background-color: #c62828;
        }

        /* --- CARRUSEL DE IMÁGENES --- */
        .hero-slider {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
        }

        .slide-card {
            min-width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <!-- 1. POP-UP DE SELECCIÓN DE SUCURSAL -->
    <div class="modal-overlay" id="modalBranch">
        <div class="modal-card">
            <h2>Selecciona tu sucursal más cercana</h2>
            
            <div class="branch-list">
                <div class="branch-item" onclick="selectBranch(this)">Quimistán</div>
                <div class="branch-item" onclick="selectBranch(this)">San Pedro Sula</div>
                <div class="branch-item" onclick="selectBranch(this)">Cortés</div>
                <div class="branch-item" onclick="selectBranch(this)">Villanueva</div>
            </div>

            <button class="btn-accept" onclick="closeModal()">Aceptar</button>
        </div>
    </div>

    <!-- 2. CARRUSEL CON LAS 3 IMÁGENES -->
    <section class="hero-slider">
        <div class="slider-wrapper" id="slider">
            <div class="slide-card" style="background-image: url('Screen_Recording_20260806_212155_WhatsApp(18).jpg');"></div>
            <div class="slide-card" style="background-image: url('Screen_Recording_20260806_212155_WhatsApp(22).jpg');"></div>
            <div class="slide-card" style="background-image: url('Screen_Recording_20260806_212155_WhatsApp(24).jpg');"></div>
        </div>
    </section>

    <!-- 3. LÓGICA JAVASCRIPT -->
    <script>
        // Selección de la sucursal activa
        function selectBranch(element) {
            document.querySelectorAll('.branch-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Cierre completo de la ventana emergente
        function closeModal() {
            const modal = document.getElementById('modalBranch');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // Movimiento automático de las 3 imágenes
        let currentIndex = 0;
        const slider = document.getElementById('slider');
        const totalSlides = 3;

        setInterval(() => {
            currentIndex = (currentIndex + 1) % totalSlides;
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
        }, 3500);
    </script>
</body>
</html>
